name: memory-ci
# Casca fina: a lógica está em tools/ci.sh (a mesma do .gitlab-ci.yml).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # segunda 06:00 UTC: modo estrito acusa conceitos com stale_after vencido

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: tools/ci.sh ${{ github.event_name == 'schedule' && '--strict' || '' }}
