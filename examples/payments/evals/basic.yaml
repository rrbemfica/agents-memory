# Perguntas (fictícias neste exemplo) com resposta-ouro. Ver spec/05-evals.md
# Os IDs em `concepts` são relativos à raiz deste bundle.
- id: pay-001
  question: "Qual o valor mínimo para uma cobrança usar Pix parcelado?"
  answer: "R$ 100"
  grader: contains
  source: payments-api:src/rules/installments.ts#validateMinimumAmount
  concepts: [/rules/pix-parcelado-minimo]

- id: pay-002
  question: "Posso colocar retry no adapter da Cielo?"
  answer: "Não. Retry é feito pela fila; o adapter envia idempotency-key (ADR-0042)."
  grader: llm
  source: https://github.com/example-org/payments-api/pull/412
  concepts: [/decisions/0042-idempotencia-adquirente]

- id: pay-003
  question: "Qual a diferença entre estorno e chargeback?"
  answer: "Estorno é iniciado por nós; chargeback é a contestação do portador junto ao banco emissor."
  grader: llm
  source: https://example.org/glossario-financeiro#chargeback
  concepts: [/terms/estorno, /terms/chargeback]

- id: pay-004
  question: "Por que não fazemos mais parcelamento financiado por nós?"
  answer: "Risco de crédito; foi substituído pelo Pix parcelado (ADR-0057 substitui ADR-0031)."
  grader: llm
  source: https://example.org/atas/2026-10-30-produto   # a fonte, nunca a nota (spec/05)
  concepts: [/decisions/0057-pix-parcelado, /decisions/0031-parcelamento-proprio]

- id: pay-005
  question: "Qual o timeout da integração com a Cielo?"
  answer: "15 s"
  grader: contains
  source: payments-api:config/acquirers.yaml#cielo.timeout
  concepts: [/services/cielo]
