# Recomendações do agents-memory — lidas por tools/validate.py.
# O formato é só OKF v0.2 (https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md).
# Tudo aqui é RECOMENDAÇÃO de uso do padrão: o validador avisa, não bloqueia.
# Só viram erro: violações da OKF e segredos (ver tools/validate.py).
version: 0.4
okf_version: "0.2"

# Bundles OKF deste repo (cada um tem index.md raiz com okf_version)
bundles:
  - knowledge
  - examples/payments

# Bundles em que --strict (rodada agendada) torna stale_after vencido um erro. Exemplos fictícios só avisam.
strict_bundles: [knowledge]

enums:
  status: [draft, stable, deprecated]          # OKF §5.4 (ausente = stable)
  grader: [exact, contains, llm]

# Campos de frontmatter da OKF v0.2 que usamos. Outro campo gera aviso (a OKF permite, nós preferimos não usar).
okf_fields: [type, title, description, resource, tags, status, generated, verified, stale_after, sources]

# Campos da OKF que recomendamos preencher (a OKF só exige `type`)
recommended_fields: [title, description, generated, sources]

# Vocabulário recomendado de tipos (a OKF deixa cada produtor definir o seu)
types:
  Decision:
    folder: decisions
    sections: [Contexto, Decisão, Alternativas rejeitadas, Consequências]
    quote: true                   # ao menos uma nota de rodapé com trecho literal entre aspas
    human_review: true            # human: em generated.by ou verified, fora de draft
  Business Rule:
    folder: rules
    sections: [Regra, Motivo]
  Term:
    folder: terms
    sections: [Definição, Exemplo, Não confundir com]
  Service:
    folder: services
    recommended: [resource]
    sections: [Responsabilidade]
  Runbook:
    folder: runbooks
    sections: [Quando usar, Passos, Como verificar]
  Incident:
    folder: incidents
    sections: [Resumo, Impacto, Causa, Lições]
  Meeting:
    folder: meetings
    recommended: [stale_after]

# Tags em que recomendamos revisão humana (verified por human:), fora de draft
human_review_tags: [security, compliance, money, external-source]
