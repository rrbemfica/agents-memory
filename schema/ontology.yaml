# Convenções do agents-memory — fonte de verdade para tools/validate.py.
# Só OKF v0.2 (https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md), sem campos próprios.
# O que está aqui são regras de USO do padrão (tipos, seções, quando exigir humano), não extensões do formato.
# Mudanças aqui exigem PR revisado pelos donos de schema/ (ver CODEOWNERS) e atualização de spec/02 e spec/03.
version: 0.3
okf_version: "0.2"

# Bundles OKF deste repo (cada um tem index.md raiz com okf_version)
bundles:
  - knowledge
  - examples/payments

enums:
  status: [draft, stable, deprecated]          # OKF §5.4 (ausente = stable)
  grader: [exact, contains, llm]

# Campos de frontmatter da OKF v0.2 que usamos. Qualquer outro gera aviso (mantém o bundle sem extensões).
okf_fields: [type, title, description, resource, tags, status, generated, verified, stale_after, sources]

# Campos da OKF que tornamos obrigatórios (o padrão só exige `type`)
required_fields: [type, title, description, generated, sources]

types:
  Decision:
    folder: decisions
    sections: [Contexto, Decisão, Alternativas rejeitadas, Consequências]
    requires_quote: true          # ao menos uma nota de rodapé com trecho literal entre aspas
    requires_human: true          # human: em generated.by ou verified (quando não for draft)
  Business Rule:
    folder: rules
    sections: [Regra, Motivo]
  Term:
    folder: terms
    sections: [Definição, Exemplo, Não confundir com]
  Service:
    folder: services
    required: [resource]
    sections: [Responsabilidade]
  Runbook:
    folder: runbooks
    sections: [Quando usar, Passos, Como verificar]
  Incident:
    folder: incidents
    sections: [Resumo, Impacto, Causa, Lições]
  Meeting:
    folder: meetings
    required: [stale_after]

# Tags que exigem revisão humana (verified por human:), exceto em status draft
human_required_tags: [security, compliance, money, external-source]

