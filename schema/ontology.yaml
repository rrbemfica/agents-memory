# Ontologia do agents-memory — fonte de verdade para tools/validate.py.
# Alinhada à OKF v0.2 (https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md).
# Mudanças aqui exigem PR revisado pelos donos de knowledge/org e atualização de spec/02 e spec/03.
version: 0.2
okf_version: "0.2"

# Bundles OKF deste repo (cada um tem index.md raiz com okf_version)
bundles:
  - knowledge
  - examples/payments

enums:
  status: [draft, stable, deprecated]          # OKF §5.4 (ausente = stable)
  grader: [exact, contains, llm]

# Prefixos de ator (OKF §7). "team:" é usado em owner e sources[].author.
actors:
  human: "human:"
  process: "process:"
  team: "team:"

# Campos que exigimos além do `type` da OKF (o padrão só exige `type`)
required_fields: [type, title, description, owner, generated, sources]

types:
  Decision:
    folder: decisions
    sections: [Contexto, Decisão, Alternativas rejeitadas, Consequências]
    requires_quote: true          # ao menos uma fonte com quote literal
    requires_human: true          # human: em generated.by ou verified (quando não for draft)
  Business Rule:
    folder: rules
    sections: [Regra, Motivo]
  Term:
    folder: terms
    sections: [Definição, Exemplo, Não confundir com]
  Service:
    folder: services
    required: [resource]
    sections: [Responsabilidade]
  Runbook:
    folder: runbooks
    sections: [Quando usar, Passos, Como verificar]
  Incident:
    folder: incidents
    sections: [Resumo, Impacto, Causa, Lições]
  Meeting:
    folder: meetings
    required: [stale_after]

# Tags que exigem revisão humana (verified por human:), exceto em status draft
human_required_tags: [security, compliance, money, external-source]

# Relações tipadas (EXTENSÃO nossa; na OKF todo link é não tipado).
# Alvos são IDs de conceito relativos ao bundle, com "/" inicial (ex.: /domains/payments/terms/estorno).
relations:
  dependsOn:    {from: [Service], to: [Service]}
  implements:   {from: [Service], to: [Business Rule]}
  decidesAbout: {from: [Decision], to: [Service, Business Rule, Runbook, Term]}
  supersedes:   {from: [Decision], to: [Decision]}
  usesTerm:     {from: "*", to: [Term]}
  causedBy:     {from: [Incident], to: [Service, Decision]}
  produced:     {from: [Incident, Meeting], to: "*"}
  relatesTo:    {from: "*", to: "*"}

# Nome da relação inversa, usada apenas no grafo gerado
inverse:
  dependsOn: dependencyOf
  implements: implementedBy
  decidesAbout: decidedBy
  supersedes: supersededBy
  usesTerm: usedBy
  causedBy: caused
  produced: producedBy
  relatesTo: relatesTo
  links: linkedFrom

limits:
  body_words_warn: 400
  index_lines_warn: 60
